1	[project]
2	name = "finally-backend"
3	version = "0.1.0"
4	description = "FinAlly backend - AI Trading Workstation"
5	readme = "README.md"
6	requires-python = ">=3.12"
7	dependencies = [
8	    "fastapi>=0.115.0",
9	    "uvicorn[standard]>=0.32.0",
10	    "numpy>=2.0.0",
11	    "massive>=1.0.0",
12	    "rich>=13.0.0",
13	]
14	
15	[project.optional-dependencies]
16	dev = [
17	    "pytest>=8.3.0",
18	    "pytest-asyncio>=0.24.0",
19	    "pytest-cov>=5.0.0",
20	    "ruff>=0.7.0",
21	]
22	
23	[build-system]
24	requires = ["hatchling"]
25	build-backend = "hatchling.build"
26	
27	[tool.hatch.build.targets.wheel]
28	packages = ["app"]
29	
30	[tool.pytest.ini_options]
31	testpaths = ["tests"]
32	python_files = ["test_*.py"]
33	python_classes = ["Test*"]
34	python_functions = ["test_*"]
35	asyncio_mode = "auto"
36	asyncio_default_fixture_loop_scope = "function"
37	
38	[tool.ruff]
39	line-length = 100
40	target-version = "py312"
41	
42	[tool.ruff.lint]
43	select = ["E", "F", "I", "N", "W"]
44	ignore = ["E501"]  # Line too long (handled by formatter)
45	
46	[tool.coverage.run]
47	source = ["app"]
48	omit = ["tests/*"]
49	
50	[tool.coverage.report]
51	exclude_lines = [
52	    "pragma: no cover",
53	    "def __repr__",
54	    "raise AssertionError",
55	    "raise NotImplementedError",
56	    "if __name__ == .__main__.:",
57	    "if TYPE_CHECKING:",
58	]
59	